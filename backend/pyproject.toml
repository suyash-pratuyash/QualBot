[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "qualbot-backend"
version = "1.0.0"
description = "QualBot conversational lead qualification engine"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0","uvicorn[standard]>=0.30,<1.0","pydantic-settings>=2.5,<3.0","email-validator>=2.2,<3.0","sqlalchemy>=2.0,<3.0","alembic>=1.13,<2.0","psycopg[binary]>=3.2,<4.0","httpx>=0.27,<1.0","PyJWT>=2.9,<3.0","bcrypt>=4.2,<5.0"]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0","ruff>=0.6,<1.0"]
[tool.setuptools.packages.find]
where=["."]
include=["app*"]
[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["."]
addopts="-ra"
[tool.ruff]
line-length=100
target-version="py311"
[tool.ruff.lint]
select=["E","F","I","UP","B"]
[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py"=["E501"]
